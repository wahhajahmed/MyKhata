name: Release

# Manual only: publishing artifacts is an explicit, auditable action.
# This workflow creates a DRAFT release; a human must review signatures and
# explicitly publish it. Signing secrets are optional and never committed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.2.0
        required: true
        type: string
      verification:
        description: Type "verified" after reviewing the CI results and local verification report
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before release
    if: ${{ inputs.verification == 'verified' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p tsconfig.electron.json
      - run: npm test
      - run: npm run build

  windows:
    name: Windows installer (signed only if secrets are configured)
    if: ${{ inputs.verification == 'verified' }}
    runs-on: windows-latest
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.MYKHATA_WINDOWS_CSC_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare Windows code-signing certificate
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.MYKHATA_WINDOWS_CSC_BASE64 }}
          CSC_PASSWORD: ${{ secrets.MYKHATA_WINDOWS_CSC_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mykhata-codesign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CSC_BASE64))
          "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CSC_KEY_PASSWORD=$env:CSC_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run rebuild:electron
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  android:
    name: Android release APK/AAB (signed only if secrets are configured)
    if: ${{ inputs.verification == 'verified' }}
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.MYKHATA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" platform-tools
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Derive Android version from release tag
        id: version
        shell: bash
        run: |
          number="${{ inputs.version }}"
          number="${number#v}"
          major="${number%%.*}"
          rest="${number#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          patch="${patch%%.*}"
          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then echo "Invalid version tag" >&2; exit 1; fi
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$number" >> "$GITHUB_OUTPUT"
      - name: Decode Android keystore
        if: env.HAS_ANDROID_SIGNING == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MYKHATA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/mykhata-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mykhata-signing/release.jks"
      - name: Build release APK and AAB
        env:
          MYKHATA_KEYSTORE_FILE: ${{ env.HAS_ANDROID_SIGNING == 'true' && format('{0}/mykhata-signing/release.jks', runner.temp) || '' }}
          MYKHATA_KEYSTORE_PASSWORD: ${{ secrets.MYKHATA_KEYSTORE_PASSWORD }}
          MYKHATA_KEY_ALIAS: ${{ secrets.MYKHATA_KEY_ALIAS }}
          MYKHATA_KEY_PASSWORD: ${{ secrets.MYKHATA_KEY_PASSWORD }}
        shell: bash
        run: |
          ./android/gradlew -p android assembleRelease bundleRelease --no-daemon \
            -PmykhataVersionCode=${{ steps.version.outputs.code }} \
            -PmykhataVersionName=${{ steps.version.outputs.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release:
    name: Create draft GitHub release
    needs: [verify, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: MyKhata ${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
          body: |
            Draft release created from the manual verification workflow.

            Verify each artifact's signature before publishing. When signing secrets are not
            configured, these builds are **unsigned**: Android will refuse to install the APK/AAB
            normally and Windows SmartScreen may warn. Publishing requires explicit human approval.
