name: Release

# Manual, draft-only release workflow. Production signing is mandatory.
# Signing material is read from repository secrets, validated before any build,
# and never written to source, artifacts, Git, or step outputs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.2.0
        required: true
        type: string
      verification:
        description: Type "verified" after reviewing the CI results and local verification report
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      code: ${{ steps.release.outputs.code }}
    steps:
      - name: Validate manual confirmation and tag
        id: release
        shell: bash
        env:
          VERIFICATION: ${{ inputs.verification }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERIFICATION" != 'verified' ]]; then
            echo 'Manual verification confirmation must be exactly "verified".' >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          version="${TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  validate-windows-signing:
    name: Validate Windows signing credentials
    needs: validate-inputs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate certificate before any build
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.MYKHATA_WINDOWS_CSC_BASE64 }}
          CSC_PASSWORD: ${{ secrets.MYKHATA_WINDOWS_CSC_PASSWORD }}
          MYKHATA_WINDOWS_CERT_SHA256: ${{ secrets.MYKHATA_WINDOWS_CERT_SHA256 }}
        run: |
          & .github/scripts/prepare-windows-signing.ps1 -Destination "$env:RUNNER_TEMP/mykhata-codesign.pfx"
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/mykhata-codesign.pfx" -Force -ErrorAction SilentlyContinue

  validate-android-signing:
    name: Validate Android signing credentials
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Decode and validate keystore before any build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MYKHATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYKHATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYKHATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYKHATA_KEY_PASSWORD }}
          MYKHATA_KEYSTORE_CERT_SHA256: ${{ secrets.MYKHATA_KEYSTORE_CERT_SHA256 }}
        run: |
          bash .github/scripts/prepare-android-signing.sh "$RUNNER_TEMP/mykhata-signing/release.jks"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mykhata-signing"

  signing-gate:
    name: Release input and signing gate
    needs: [validate-inputs, validate-windows-signing, validate-android-signing]
    runs-on: ubuntu-latest
    steps:
      - name: Gate passed
        shell: bash
        run: |
          echo 'All inputs and signing credentials validated; builds may proceed.'

  windows:
    name: Windows installer (signed and verified)
    needs: [validate-inputs, signing-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare code-signing certificate
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.MYKHATA_WINDOWS_CSC_BASE64 }}
          CSC_PASSWORD: ${{ secrets.MYKHATA_WINDOWS_CSC_PASSWORD }}
          MYKHATA_WINDOWS_CERT_SHA256: ${{ secrets.MYKHATA_WINDOWS_CERT_SHA256 }}
        run: |
          & .github/scripts/prepare-windows-signing.ps1 -Destination "$env:RUNNER_TEMP/mykhata-codesign.pfx" -WriteGithubEnv
      - name: Rebuild native module for Electron
        run: npm run rebuild:electron
      - name: Build signed Windows installer
        shell: pwsh
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MYKHATA_WINDOWS_CSC_PASSWORD }}
        run: |
          npm run desktop:build
      - name: Verify signature, identity and checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs['validate-inputs'].outputs.version }}
          MYKHATA_WINDOWS_CERT_SHA256: ${{ secrets.MYKHATA_WINDOWS_CERT_SHA256 }}
        run: |
          & .github/scripts/verify-windows-release.ps1 `
            -ReleaseVersion $env:RELEASE_VERSION `
            -InstallerPath "release/MyKhata Setup $env:RELEASE_VERSION.exe" `
            -VerifiedDir 'release/verified'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verified
          path: release/verified/*
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/mykhata-codesign.pfx" -Force -ErrorAction SilentlyContinue

  android:
    name: Android release APK/AAB (signed and verified)
    needs: [validate-inputs, signing-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" platform-tools
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Prepare Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MYKHATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYKHATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYKHATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYKHATA_KEY_PASSWORD }}
          MYKHATA_KEYSTORE_CERT_SHA256: ${{ secrets.MYKHATA_KEYSTORE_CERT_SHA256 }}
        run: |
          bash .github/scripts/prepare-android-signing.sh "$RUNNER_TEMP/mykhata-signing/release.jks"
      - name: Build signed release APK and AAB
        shell: bash
        env:
          MYKHATA_KEYSTORE_FILE: ${{ runner.temp }}/mykhata-signing/release.jks
          MYKHATA_KEYSTORE_PASSWORD: ${{ secrets.MYKHATA_KEYSTORE_PASSWORD }}
          MYKHATA_KEY_ALIAS: ${{ secrets.MYKHATA_KEY_ALIAS }}
          MYKHATA_KEY_PASSWORD: ${{ secrets.MYKHATA_KEY_PASSWORD }}
        run: |
          ./android/gradlew -p android assembleRelease bundleRelease --no-daemon \
            -PmykhataRequireReleaseSigning=true \
            -PmykhataVersionCode=${{ needs['validate-inputs'].outputs.code }} \
            -PmykhataVersionName=${{ needs['validate-inputs'].outputs.version }}
      - name: Verify signatures, identity and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs['validate-inputs'].outputs.version }}
          RELEASE_CODE: ${{ needs['validate-inputs'].outputs.code }}
          MYKHATA_KEYSTORE_CERT_SHA256: ${{ secrets.MYKHATA_KEYSTORE_CERT_SHA256 }}
        run: |
          bash .github/scripts/verify-android-release.sh "$RELEASE_VERSION" "$RELEASE_CODE" 'release/verified-android'
      - uses: actions/upload-artifact@v4
        with:
          name: android-verified
          path: release/verified-android/*
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mykhata-signing"

  release:
    name: Create draft GitHub release
    needs: [validate-inputs, signing-gate, windows, android]
    if: ${{ needs['validate-inputs'].result == 'success' && needs['signing-gate'].result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-verified'
      - name: Confirm only verified signed artifacts are present
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs['validate-inputs'].outputs.version }}
        run: |
          set -euo pipefail
          test -f "artifacts/windows-verified/MyKhata Setup $RELEASE_VERSION.exe"
          test -f 'artifacts/windows-verified/SHA256SUMS.txt'
          test -f 'artifacts/android-verified/app-release.apk'
          test -f 'artifacts/android-verified/app-release.aab'
          test -f 'artifacts/android-verified/SHA256SUMS.txt'
          if find artifacts -type f \( -iname '*unsigned*' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.key' -o -iname '*.pem' \) | grep -q .; then
            echo 'Unverified or signing material found in release artifacts.' >&2
            exit 1
          fi
      - name: Create draft release (never publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: MyKhata ${{ inputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows-verified/*
            artifacts/android-verified/*
          body: |
            Draft release created only after the signed release gate passed.

            Artifacts in this draft have passed:
            - Windows Authenticode verification with SignTool and product/version identity checks
            - Android APK verification with apksigner and AAB JAR verification with jarsigner/keytool
            - Application id `com.mykhata.app`, versionName and versionCode checks
            - SHA-256 checksum generation via `SHA256SUMS.txt`

            This release is a DRAFT and is never published automatically. Before publishing, a human must:
            - verify the checksums and signer identities independently
            - complete physical Android SQLCipher unlock-after-restart testing
            - complete physical Android biometric unlock testing
            - complete physical airplane-mode offline testing on Android and Windows
